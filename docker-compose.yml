services:
  backend:
    image: ${IMAGE_NAME}:staging
    container_name: auto-invest-backend-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: auto-invest-postgres-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: auto-invest-redis-staging
    restart: unless-stopped

volumes:
  postgres_data:
